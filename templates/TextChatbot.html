<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Text Chatbot</title>
</head>
<body>
    <h1>Text Chatbot</h1>
    <p>Ask a question and get a response from the chatbot.</p>
    <form id="chat-form">
        <label for="mytext">Your question:</label><br />
        <input id="mytext" name="mytext" type="text" size="80" autocomplete="off" />
        <button type="submit">Send</button>
    </form>
    <div id="response" style="margin-top: 1rem; white-space: pre-wrap;"></div>

    <script>
    document.getElementById('chat-form').addEventListener('submit', async function(event) {
        event.preventDefault();
        const text = document.getElementById('mytext').value.trim();
        if (!text) {
            return;
        }

        const response = await fetch('/ChatData?mytext=' + encodeURIComponent(text));
        const body = await response.text();
        document.getElementById('response').textContent = body;
    });
    </script>
</body>
</html>
